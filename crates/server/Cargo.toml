[package]
name = "tgprep-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "http2", "tokio"] }
axum-server = { version = "0.9.2", features = ["tls-rustls-no-provider"] }
brotli = "9.1.1"
flate2 = "1.1.11"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
thiserror.workspace = true
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "fs"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
