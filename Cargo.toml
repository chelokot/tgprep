[workspace]
resolver = "3"
members = ["crates/model", "crates/server", "crates/web", "crates/worker"]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
indexmap = { version = "2.14.2", features = ["serde"] }
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
thiserror = "2.0.21"
tgprep-model = { path = "crates/model" }
tgprep-worker = { path = "crates/worker" }
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 1

[profile.web]
inherits = "release"
opt-level = "z"
lto = "fat"
panic = "abort"
